# Provider: Antigravity CLI over its ACP stdio server.
- insert:
    - id: subagent-agy
      name: '@douglarek/dsh-subagent-agy/provider'
      config:
        providerName: agy
        # Bare name resolves through PATH; point at an absolute path when the
        # GUI app's PATH does not include the install dir (e.g.
        # ~/.local/bin/agy on Linux, /Users/<you>/.local/bin/agy on macOS).
        command: agy
        args: ['acp']
        permission: allow
        model: ''
        # Reuse one Antigravity conversation per session key (the tool's `session`
        # argument, or this DSH session when omitted).
        reuseSession: true
        transcriptDir: ''
    - id: tool-subagent-agy
      name: '@douglarek/dsh-subagent-agy/tool'
      config:
        provider: agy
        toolName: subagent_agy
